name: Existing DSP plugin latency ABI

on:
  push:
    branches: [feat/report-existing-plugin-latencies]
  pull_request:
    paths:
      - plugins/**
      - .github/workflows/existing-plugin-latency.yml

permissions:
  contents: read

jobs:
  build-latency-waps:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
      - uses: actions/checkout@v4
        with:
          repository: wyldtone/wyldtone-plugin-sdk
          ref: feat/wasm-latency-reporting
          path: sdk
      - name: Prepare SDK container mounts
        shell: bash
        run: |
          mkdir -p JUCE-upstream sdk/.cache/cargo sdk/.cache/target
          cat > sdk/compose.override.yaml <<'YAML'
          services:
            sdk:
              volumes:
                - ../examples/plugins:/workspace/projects
          YAML
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build SDK Docker environment
        working-directory: sdk
        run: docker compose build sdk
      - name: Compile and validate all latency-reporting WAPs
        working-directory: sdk
        run: |
          docker compose run --rm sdk shell -c '
            set -eu
            for name in ModernDistortion VintageFuzz WarmDrive WyldtoneNoiseReduction PolyOctaver PolyOctaverLive PolyOctaverStudio; do
              config="/workspace/projects/$name/plugin.config.json"
              echo "Build $name"
              cargo run --release --locked -p wyldtone-cli -- build "$config"
              for wap in "/workspace/projects/$name/build/wyldtone/"*.wap; do
                cargo run --release --locked -p wyldtone-cli -- validate "$wap"
              done
            done
          '
